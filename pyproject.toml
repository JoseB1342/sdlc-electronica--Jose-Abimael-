[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 250


[tool.ruff.lint]
select = ["E","F","I","UP","B"]
ignore = ["B008"]

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases =true

[tool.coverage.run]
omit = ["app/mqtt_client.py"]